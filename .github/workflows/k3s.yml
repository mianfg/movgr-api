name: k3s

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mianfg/movgr-api:${{ github.sha }}
            ghcr.io/mianfg/movgr-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/mianfg/movgr-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/movgr-api/visibility \
            -f visibility=public || true

      - name: Point guava at this image
        env:
          GH_TOKEN: ${{ secrets.GUAVA_GITOPS_TOKEN }}
          IMAGE: ghcr.io/mianfg/movgr-api:${{ github.sha }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/mianfg/guava.git" "$tmp"
          python3 scripts/bump-guava-movgr-image.py "$tmp/cluster/apps/public/movgr/movgr.yaml" "$IMAGE"
          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmp" add cluster/apps/public/movgr/movgr.yaml
          if git -C "$tmp" diff --cached --quiet; then
            echo "guava already on $IMAGE"
            exit 0
          fi
          git -C "$tmp" commit -m "Bump movgr to ${IMAGE##*:}"
          git -C "$tmp" push origin HEAD:main
