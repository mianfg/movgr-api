name: k3s

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/movgr-api:${{ github.sha }}
  MANIFEST: cluster/apps/public/movgr/movgr.yaml

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point guava at this image
        env:
          GH_TOKEN: ${{ secrets.GUAVA_GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/mianfg/guava.git" "$tmp"
          python3 "$tmp/scripts/set-app-image.py" "$tmp/$MANIFEST" movgr "$IMAGE"
          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmp" add "$MANIFEST"
          if git -C "$tmp" diff --cached --quiet; then
            echo "guava already on $IMAGE"
            exit 0
          fi
          git -C "$tmp" commit -m "Bump movgr to ${IMAGE##*:}"
          git -C "$tmp" push origin HEAD:main
